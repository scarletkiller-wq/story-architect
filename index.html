/* iPad / touch workspace */
html,body{height:100%;overscroll-behavior:none} .app{height:100dvh;min-height:0}
button,select,input,textarea{ -webkit-tap-highlight-color:transparent }

.canvasWrap,.boardCanvas{overscroll-behavior:contain;-webkit-user-select:none;user-select:none}
.node,.boardCard,.boardGroup{touch-action:none;-webkit-user-select:none;user-select:none}
#tabletControls{display:none;align-items:center;gap:5px;flex-shrink:0}
.tabletAction{min-width:40px;min-height:40px;padding:7px 9px!important;font-size:14px;font-weight:650}
#tabletShade{display:none}
#tabletMenu{display:none;position:fixed;z-index:105;top:60px;right:10px;width:min(260px,calc(100vw - 20px));background:#18263b;border:1px solid #52678a;border-radius:12px;padding:9px;box-shadow:0 12px 38px #000b}
#tabletMenu.open{display:grid;gap:7px}
#tabletMenu button{width:100%;text-align:left;min-height:42px}
#tabletCloseLeft,#tabletCloseRight{display:none}
.mobileHelp{display:none}
@media(pointer:coarse){
 button,.modeBtn{min-height:40px}

 .node{min-height:112px}

}
@media(max-width:1180px){
 .app{grid-template-rows:56px minmax(0,1fr) 26px}
 .top{gap:6px;padding:0 10px;padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}
 .brand small{display:none}.brand b{font-size:13px}.mark{width:29px;height:29px}
 .titleinput{min-width:0;width:min(210px,22vw);font-size:13px!important;padding:7px}
 #tabletControls{display:flex}
 .top .toolbar{margin-left:auto;flex-wrap:nowrap}
 .top .toolbar #newBtn,.top .toolbar #importBtn,.top .toolbar #exportBtn,.top .toolbar #undoBtn,.top .toolbar #redoBtn{display:none}
 .top .toolbar #saveBtn{padding:8px 10px;min-height:40px}
 .main{grid-template-columns:minmax(0,1fr);position:relative;min-height:0}
 .middle{grid-column:1;grid-row:1;min-height:0}
 .left,.right{display:block!important;position:absolute;top:0;bottom:0;width:min(360px,88vw);z-index:102;box-shadow:0 14px 40px #0009;visibility:hidden;transition:transform .18s ease,visibility .18s ease}
 .left{left:0;transform:translateX(-103%);padding-bottom:80px}
 .right{right:0;transform:translateX(103%);padding-bottom:80px}
 body.showLeft .left{visibility:visible;transform:translateX(0)}
 body.showRight .right{visibility:visible;transform:translateX(0)}
 #tabletShade{position:fixed;inset:56px 0 0;background:#0009;z-index:101}
 body.showLeft #tabletShade,body.showRight #tabletShade{display:block}
 #tabletCloseLeft,#tabletCloseRight{display:block;position:sticky;top:0;float:right;z-index:2;background:#2d3d57;margin:0 0 9px 8px}
 .modebar{height:auto;min-height:46px;padding:4px 8px;gap:3px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
 .modeBtn{padding:7px 11px;font-size:12px}
 .worktop{height:auto;min-height:51px;padding:5px 10px;gap:7px;flex-wrap:wrap}
 .worktop .row{min-width:0;flex-wrap:wrap;gap:5px}
 .worktop #boardTools{margin-left:0;max-width:100%;overflow-x:auto}
 .boardControls{flex-wrap:nowrap;min-width:max-content}
 .boardSelect{max-width:145px}

 .worktop strong{font-size:12px}
 .status{padding:0 8px;font-size:10px}
 .miniHelp{display:none}
 .mobileHelp{display:block;position:absolute;bottom:72px;left:9px;z-index:6;pointer-events:none;border-radius:8px;padding:5px 9px;background:#152135d9;color:#a5b5ce;font-size:10px}
 .extraSurface{padding:14px!important;-webkit-overflow-scrolling:touch}
 .modalBackdrop{padding:10px;align-items:center}.modal{max-height:85dvh}
}
@media(max-width:600px){
 .titleinput{width:90px}

}

<body>
<div class="app">
<header class="top"><div class="brand"><div class="mark">✧</div><div><b>Story Architect</b><small>Visual Story Designer <span class="versionTag">v0.5 PWA</span></small></div></div><input id="projectName" class="titleinput" aria-label="作品名" title="作品名"/><div id="tabletControls"><button id="tabletChapters" class="tabletAction" title="チャプターとシーン">☰</button><button id="tabletDetails" class="tabletAction" title="選択項目の編集">✎</button><button id="tabletMore" class="tabletAction" title="ファイル・編集メニュー">⋯</button></div><div class="toolbar"><button id="undoBtn" class="icon" title="元に戻す（Ctrl+Z）">↶</button><button id="redoBtn" class="icon" title="やり直し（Ctrl+Y）">↷</button><button id="newBtn" class="hideSmall">新規</button><button id="importBtn" class="hideSmall">読込</button><button id="exportBtn" class="hideSmall">書出</button><button id="saveBtn" class="primary">保存</button></div></header>
<div class="main"><aside class="left"><button id="tabletCloseLeft" class="tabletAction" aria-label="閉じる">✕</button><div class="sectionrow"><div class="sectionhead">CHAPTERS & SCENES</div><button id="addChapterBtn" class="icon" title="章を追加">＋</button></div><div id="chapterList"></div><div class="row" style="margin:16px 6px 5px"><button id="addSceneSide" style="flex:1">＋ シーンを追加</button></div><div class="leftfooter"><strong>操作ヒント</strong><br>接続：ノード右の丸 → 別ノード左の丸<br>詳細：ノードを選択して右側で編集<br>ズーム：マウスホイール<br>移動：背景をドラッグ<br>複数選択：Shift + クリック</div></aside>
<section class="middle"><div class="modebar"><button id="flowModeBtn" class="modeBtn active">◇ ストーリーフロー</button><button id="boardModeBtn" class="modeBtn">▤ アイデアボード</button><span class="modehint" id="modeHint">シーンと分岐を編集</span></div><div class="worktop"><div class="row"><strong id="chapterHeading">全体フロー</strong><span class="chip" id="chapterChip">全チャプター</span></div><div class="row"><select id="chapterFilter" style="max-width:155px;padding:6px" aria-label="表示する章"></select><button id="addNodeBtn" class="primary">＋ ノード</button><button id="fitBtn" title="全体を表示">⤢</button></div></div><div id="canvas" class="canvasWrap" tabindex="0" aria-label="ストーリーフローキャンバス"><div id="world" class="world"><svg id="edges" class="edges" xmlns="http://www.w3.org/2000/svg"></svg><div id="nodes"></div></div><div class="miniHelp">ノードをドラッグして配置 · ●から●へ接続<br>背景ドラッグで移動 · ホイールでズーム · Deleteで削除</div><div class="zoomctl"><button id="zoomOut" class="icon">−</button><span id="zoomLabel">100%</span><button id="zoomIn" class="icon">＋</button></div></div><div id="boardCanvas" class="boardCanvas" style="display:none" aria-label="アイデアボード"><div id="boardWorld" class="boardWorld"><div id="boardCards"></div></div><div class="miniHelp">付箋をドラッグして移動 · クリックして右側で編集<br>背景ドラッグで移動 · ホイールでズーム</div><div class="zoomctl"><button id="boardZoomOut" class="icon">−</button><span id="boardZoomLabel">100%</span><button id="boardZoomIn" class="icon">＋</button></div></div></section>
<aside class="right" id="inspector"></aside></div><footer class="status"><span id="statusText">準備完了</span><span id="saveStatus">自動保存オン</span></footer></div>
<div id="tabletShade"></div><div id="tabletMenu"><button data-mobile-action="newBtn">＋ 新規プロジェクト</button><button data-mobile-action="importBtn">⇧ JSONを読み込む</button><button data-mobile-action="exportBtn">⇩ JSONを書き出す</button><button data-mobile-action="undoBtn">↶ 元に戻す</button><button data-mobile-action="redoBtn">↷ やり直す</button><button id="tabletHelpBtn">？ タッチ操作ガイド</button><button id="tabletInstallBtn">▣ ホーム画面に追加</button></div><div id="modalBackdrop" class="modalBackdrop"><div id="modal" class="modal" role="dialog" aria-modal="true"></div></div><div id="toast" class="toast" role="status"></div><input type="file" id="fileInput" accept=".json,application/json" hidden>
<script>
'use strict';
const STORAGE_KEY='story-architect-v01'; // 旧版と同じ自動保存領域を使用
const $=s=>document.querySelector(s);
const uid=()=>globalThis.crypto?.randomUUID?.()||('id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

if(mode==='foreshadow'){$('#newForeshadow').onclick=()=>mutate(()=>{let f={id:uid(),name:'新しい伏線',description:'',setupId:'',hintId:'',payoffId:'',status:'open'};p.foreshadowing.push(f);editForeshadow=f.id});root.querySelectorAll('[data-fsid]').forEach(b=>b.onclick=()=>{editForeshadow=b.dataset.fsid;refreshExtended()});if($('#fsName')){const f=p.foreshadowing.find(x=>x.id===editForeshadow);bindText('#fsName',v=>f.name=v);bindText('#fsDesc',v=>f.description=v);for(const key of ['setupId','hintId','payoffId'])$('#fs_'+key).onchange=e=>mutate(()=>f[key]=e.target.value);$('#fsStatus').onchange=e=>mutate(()=>f.status=e.target.value);$('#fsBack').onclick=()=>{editForeshadow=null;refreshExtended()};$('#removeForeshadow').onclick=()=>mutate(()=>{p.foreshadowing=p.foreshadowing.filter(x=>x.id!==f.id);editForeshadow=null})}}
if(mode==='timeline'){root.querySelectorAll('[data-time]').forEach(line=>{let n=getNode(line.dataset.time);for(const key of ['storyOrder','revealOrder','storyDate']){line.querySelector('.'+key).onchange=e=>mutate(()=>{n[key]=key==='storyDate'?e.target.value:e.target.value===''?null:Number(e.target.value)})}})}
if(mode==='sim'){$('#simReset').onclick=()=>{resetSimulation();refreshExtended()};root.querySelectorAll('[data-sim-edge]').forEach(b=>b.onclick=()=>{const e=p.edges.find(x=>x.id===b.dataset.simEdge);if(!e||!testCondition(e.condition,sim.vars))return;if(sim.steps>=200){notify('200ステップに到達しました。ループを確認してください');return}applyEffects(e);sim.node=e.target;sim.visited.push(e.target);sim.steps++;refreshExtended()})}}
const oldRenderInspector=renderInspector;
renderInspector=function(){oldRenderInspector();if(activeMode!=='flow')return;const ins=$('#inspector');if(selectedEdge){let edge=p.edges.find(e=>e.id===selectedEdge);if(!edge)return;const cond=edge.condition||{},firstVar=varById(cond.variableId);const effects=edge.effects||[];let addition=document.createElement('div');addition.innerHTML=`<hr><h3>条件分岐</h3><div class="field"><label>参照する変数</label><select id="edgeVar">${selectHtml(p.variables,cond.variableId,'条件なし（常に遷移可能）')}</select></div><div class="field"><label>比較演算子</label><select id="edgeOperator">${[['equals','等しい（=）'],['not_equals','等しくない（≠）'],['greater','大きい（>）'],['less','小さい（<）'],['gte','以上（≥）'],['lte','以下（≤）']].map(([k,l])=>`<option value="${k}" ${cond.operator===k?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>比較する値</label><input id="edgeValue" value="${esc(String(cond.value??(firstVar?.type==='boolean'?'true':'')))}" placeholder="true / 1 / テキスト"></div><hr><h3>遷移時の変数変更</h3>${effects.map((e,i)=>`<div class="connection"><span>${esc(varById(e.variableId)?.name||'不明')} ${esc(e.operation==='add'?'+=':'=')} ${esc(String(e.value))}</span><button data-remove-effect="${i}">削除</button></div>`).join('')}<div class="field"><label>変更する変数</label><select id="effectVar">${selectHtml(p.variables,'','変数を選択')}</select></div><div class="field"><label>操作</label><select id="effectOp"><option value="set">代入</option><option value="add">加算（数値）</option></select></div><div class="field"><label>値</label><input id="effectValue" value="true"></div><button id="addEffect">＋ 変更を追加</button><p class="subtle">比較は単一条件です。複合条件（AND/OR/NOT）は今後の拡張予定です。</p>`;ins.appendChild(addition);$('#edgeVar').onchange=ev=>mutate(()=>edge.condition=ev.target.value?{variableId:ev.target.value,operator:'equals',value:varById(ev.target.value)?.type==='boolean'?true:varById(ev.target.value)?.type==='number'?0:''}:null);$('#edgeOperator').onchange=e=>mutate(()=>{if(edge.condition)edge.condition.operator=e.target.value});$('#edgeValue').onchange=e=>mutate(()=>{if(edge.condition)edge.condition.value=parseVal(e.target.value,varById(edge.condition.variableId)?.type||'string')});addition.querySelectorAll('[data-remove-effect]').forEach(b=>b.onclick=()=>mutate(()=>edge.effects.splice(+b.dataset.removeEffect,1)));$('#addEffect').onclick=()=>{const id=$('#effectVar').value;if(!id){notify('変更する変数を選択してください');return}mutate(()=>{if(!edge.effects)edge.effects=[];edge.effects.push({variableId:id,operation:$('#effectOp').value,value:parseVal($('#effectValue').value,varById(id).type)})})};return}const n=getNode(selected);if(!n)return;let section=document.createElement('div');section.innerHTML=`<hr><h3>関連する設定資料</h3>${Object.keys(KINDS).map(k=>`<div class="field"><label>${KINDS[k]}</label><select multiple size="${Math.min(4,Math.max(2,p.library[k].length))}" data-sceneref="${k}" style="min-height:70px">${p.library[k].map(o=>`<option value="${esc(o.id)}" ${(n.refs?.[k]||[]).includes(o.id)?'selected':''}>${esc(o.name)}</option>`).join('')}</select><p class="subtle">Ctrlキーで複数選択</p></div>`).join('')}<hr><h3>時系列</h3><button id="openTimeline">時系列モードで編集 ↗</button>`;ins.appendChild(section);section.querySelectorAll('[data-sceneref]').forEach(sel=>sel.onchange=()=>mutate(()=>{if(!n.refs)n.refs={};n.refs[sel.dataset.sceneref]=[...sel.selectedOptions].map(o=>o.value)}));$('#openTimeline').onclick=()=>switchMode('timeline')};

// Advanced branch rules: single base condition plus additional AND/OR predicates.
const baseTestCondition=testCondition;
testCondition=function(cond,vars){
 if(!cond)return true;
 if(cond.logicRules){const results=cond.logicRules.map(c=>baseTestCondition(c,vars));const valid=cond.logic==='OR'?results.some(Boolean):results.every(Boolean);return cond.negate?!valid:valid}
 return baseTestCondition(cond,vars)
};
function edgeCanPass(e,vars){
 const primary=e.condition?baseTestCondition(e.condition,vars):null;
 const others=(e.additionalConditions||[]).map(c=>baseTestCondition(c,vars));
 if(!others.length)return e.negateCondition?!Boolean(primary??true):Boolean(primary??true);
 const tests=primary===null?others:[primary,...others];const outcome=e.conditionLogic==='OR'?tests.some(Boolean):tests.every(Boolean);
 return e.negateCondition?!outcome:outcome
}
// Ensure simulator evaluates all configured conditions, not just the first one.
const baseSimHtml=simHtml;
simHtml=function(){
 const output=baseSimHtml();
 const n=getNode(sim.node);
 if(!n)return output;
 let html=output;
 for(const e of p.edges.filter(a=>a.source===n.id)){
  if(!edgeCanPass(e,sim.vars)&&testCondition(e.condition,sim.vars)){
   const safeId=esc(e.id);
   html=html.replace(`data-sim-edge="${safeId}" `,`data-sim-edge="${safeId}" disabled `);
  }
  if(edgeCanPass(e,sim.vars)&&!testCondition(e.condition,sim.vars)){
   const safeId=esc(e.id);
   html=html.replace(`data-sim-edge="${safeId}" disabled`, `data-sim-edge="${safeId}"`);
  }
 }
 return html;
};
const baseBindExtended=bindExtended;
bindExtended=function(mode){baseBindExtended(mode);if(mode==='sim'){
 $('#surface_sim').querySelectorAll('[data-sim-edge]').forEach(btn=>{
  const edge=p.edges.find(e=>e.id===btn.dataset.simEdge);
  btn.disabled=!edgeCanPass(edge,sim.vars);
  btn.onclick=()=>{if(!edgeCanPass(edge,sim.vars))return;if(sim.steps>=200){notify('200ステップに到達しました。ループを確認してください');return}applyEffects(edge);sim.node=edge.target;sim.visited.push(edge.target);sim.steps++;refreshExtended()}
 })
}}
const baseEnhancedInspector=renderInspector;
renderInspector=function(){baseEnhancedInspector();if(activeMode!=='flow'||!selectedEdge)return;const edge=p.edges.find(e=>e.id===selectedEdge);if(!edge)return;
const section=document.createElement('div');section.innerHTML=`<hr><h3>複合条件（AND / OR / NOT）</h3><p class="subtle">上の基本条件と、追加した条件を組み合わせます。条件なしの基本条件は常に真です。</p><div class="field"><label>条件を組み合わせる方法</label><select id="condLogic"><option value="AND" ${edge.conditionLogic!=='OR'?'selected':''}>AND：すべて満たす</option><option value="OR" ${edge.conditionLogic==='OR'?'selected':''}>OR：いずれかを満たす</option></select></div><div class="field"><label><input type="checkbox" id="condNegate" ${edge.negateCondition?'checked':''} style="width:auto"> NOT：条件全体を反転する</label></div>${(edge.additionalConditions||[]).map((c,i)=>`<div class="editorBox" style="padding:11px"><div class="row between"><b>追加条件 ${i+1}</b><button data-remove-cond="${i}" class="btnDanger">削除</button></div><select data-cond-var="${i}" style="margin:7px 0">${selectHtml(p.variables,c.variableId,'変数を選択')}</select><select data-cond-op="${i}" style="margin-bottom:7px">${[['equals','等しい'],['not_equals','等しくない'],['greater','大きい'],['less','小さい'],['gte','以上'],['lte','以下']].map(([k,v])=>`<option value="${k}" ${c.operator===k?'selected':''}>${v}</option>`).join('')}</select><input data-cond-value="${i}" value="${esc(String(c.value??''))}" placeholder="比較値"></div>`).join('')}<button id="newCondition" ${!p.variables.length?'disabled':''}>＋ AND / OR 条件を追加</button>`;
$('#inspector').appendChild(section);
$('#condLogic').onchange=e=>mutate(()=>edge.conditionLogic=e.target.value);
$('#condNegate').onchange=e=>mutate(()=>edge.negateCondition=e.target.checked);
$('#newCondition').onclick=()=>mutate(()=>{if(!edge.additionalConditions)edge.additionalConditions=[];const v=p.variables[0];edge.additionalConditions.push({variableId:v.id,operator:'equals',value:parseVal(v.initial,v.type)})});
section.querySelectorAll('[data-remove-cond]').forEach(btn=>btn.onclick=()=>mutate(()=>edge.additionalConditions.splice(+btn.dataset.removeCond,1)));
section.querySelectorAll('[data-cond-var]').forEach(el=>el.onchange=()=>mutate(()=>{const c=edge.additionalConditions[+el.dataset.condVar];c.variableId=el.value;c.value=parseVal(varById(el.value)?.initial,varById(el.value)?.type||'string')}));
section.querySelectorAll('[data-cond-op]').forEach(el=>el.onchange=()=>mutate(()=>edge.additionalConditions[+el.dataset.condOp].operator=el.value));
section.querySelectorAll('[data-cond-value]').forEach(el=>el.onchange=()=>mutate(()=>{let c=edge.additionalConditions[+el.dataset.condValue];c.value=parseVal(el.value,varById(c.variableId)?.type||'string')}));
};

// iPad and mobile controls: same project data and local persistence as desktop.
(function enableTablet(){
 const byId=id=>document.getElementById(id), close=()=>{document.body.classList.remove('showLeft','showRight');byId('tabletMenu').classList.remove('open')};
 function drawer(which){const cls=which==='left'?'showLeft':'showRight';const was=document.body.classList.contains(cls);close();if(!was)document.body.classList.add(cls)}
 byId('tabletChapters').addEventListener('click',()=>drawer('left'));
 byId('tabletDetails').addEventListener('click',()=>drawer('right'));
 byId('tabletShade').addEventListener('click',close);
 byId('tabletCloseLeft').addEventListener('click',close);
 // Close button belongs outside the inspector because the inspector is rerendered often.
 const detailBtn=document.createElement('button');detailBtn.id='tabletCloseRight';detailBtn.className='tabletAction';detailBtn.textContent='✕';detailBtn.title='閉じる';detailBtn.style.cssText='position:absolute;z-index:105;top:8px;right:11px;display:none;background:#334662';detailBtn.onclick=close;document.querySelector('.main').appendChild(detailBtn);
 const tabletStyle=document.createElement('style');tabletStyle.textContent='@media(max-width:1180px){body.showRight #tabletCloseRight{display:block!important}}';document.head.appendChild(tabletStyle);

 document.querySelectorAll('[data-mobile-action]').forEach(button=>button.addEventListener('click',()=>{close();byId(button.dataset.mobileAction).click()}));
 byId('tabletHelpBtn').onclick=()=>{
  close();const msg='iPad操作ガイド\n\n・ノード／付箋：指でドラッグして移動\n・画面の何もない場所：ドラッグでスクロール\n・ノード接続：右端の丸 → 接続先ノード左端の丸をタップ\n・編集：項目を選び、上部の「✎」をタップ\n・章一覧：上部の「☰」をタップ\n・ズーム：画面右下の ＋ / − をタップ\n・保存：上部の保存、ファイル出力は「⋯」から\n\n重要：Safariの保存データは消える場合があります。定期的にJSONを書き出してください。';
  if(typeof notify==='function')notify('タッチ操作ガイドを表示します');alert(msg)
 };
 // Auto-close chapter drawer once a scene/chapter is selected (event bubbles to sidebar).
 document.querySelector('.left').addEventListener('click',event=>{if(event.target.closest('.sceneItem,.chapterBtn'))close()});
 document.querySelectorAll('.modebar').forEach(el=>el.addEventListener('click',event=>{if(event.target.closest('button'))close()}));
 window.addEventListener('keydown',ev=>{if(ev.key==='Escape')close()});
 // Safari gesture events: allow canvas manipulation via buttons while preventing page zoom.
 ['gesturestart','gesturechange','gestureend'].forEach(name=>{document.querySelectorAll('#canvas,#boardCanvas').forEach(el=>el.addEventListener(name,event=>event.preventDefault(),{passive:false}))});
 // iPad touch browsers may return button=-1 for some gestures. Use primary touch as button 0.
 document.querySelectorAll('#canvas,#boardCanvas').forEach(el=>el.addEventListener('pointerdown',ev=>{if(ev.pointerType==='touch'&&ev.isPrimary&&ev.button===-1){try{Object.defineProperty(ev,'button',{value:0})}catch(e){}}},true));
 // Prevent selected inspector field from being hidden by virtual keyboard on iPad.
 document.querySelector('.right').addEventListener('focusin',ev=>{if(ev.target.matches('input,textarea,select'))setTimeout(()=>ev.target.scrollIntoView({block:'nearest',behavior:'smooth'}),200)});
})();
